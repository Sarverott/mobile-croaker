# COPY OF PREVIOUSLY CODED GITHUB WORKFLOW 
# SOURCE: https://raw.githubusercontent.com/Sarverott/juststreamsound/refs/heads/main/.github/workflows/android.yml

name: Build & Publish Release APK

on:
  # push:
  #   branches: [main, development]
  #   tags:
  #     - 'v*'
  #     - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Release Version & Tag
        id: version_step
        run: bash scripts/devops/determine_version.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/devops/setup_signing.sh

      - name: Build Release APK
        run: bash scripts/devops/build_apk.sh

      - name: Package Release APK
        id: prepare_apk
        run: bash scripts/devops/package_release.sh

      - name: Check for Release Notes
        id: release_notes
        run: bash scripts/devops/check_release_notes.sh

      - name: Create Git Tag if Not Exists
        run: bash scripts/devops/create_tag.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
