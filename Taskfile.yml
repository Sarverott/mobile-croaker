# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  devops: ./scripts/devops/Taskfile.yml
  docs: ./docs/Taskfile.yml

vars:
  PROJECT_NAME: "Mobile Croaker"
  SCOPE: "RAUSON (RavensArmy User Simulating Operational Node)"
  IDENTITY: "Inceptorium Apokryf (apokryf.pl)"

tasks:
  default:
    desc: List available project tasks
    cmds:
      - task --list
    silent: true

  info:
    desc: Display Mobile Croaker system information and metadata
    cmds:
      - echo "{{.PROJECT_NAME}} - {{.SCOPE}}"
      - echo "Identity {{.IDENTITY}}"
      - echo "Platform Android (SDK 24-36) / Java 17+ / Gradle 9+"

  test:
    desc: Run JVM unit tests
    cmds:
      - ./gradlew testDebugUnitTest

  build:
    desc: Build debug APK artifact
    cmds:
      - ./gradlew assembleDebug

  release:
    desc: Build signed release APK artifact
    cmds:
      - task: devops:build

  package:
    desc: Package release APK
    cmds:
      - task: devops:package

  clean:
    desc: Clean build artifacts and Gradle caches
    cmds:
      - ./gradlew clean

  wrapper:
    desc: Ensure Gradle wrapper binaries are up to date
    cmds:
      - gradle wrapper
